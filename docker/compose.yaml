# Base dev container (headless). dev.sh / dev.ps1 add one GUI overlay: gui-x11.yaml, gui-wslg.yaml or gui-vnc.yaml.
name: karr

services:
  ros:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: karr-dev:jazzy
    container_name: karr_dev
    stdin_open: true
    tty: true
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # CPU (llvmpipe) OpenGL: reliable everywhere for rviz. Set to 0 to try the GPU (x11 / wslg only).
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      # build/ install/ log/ live in a named volume (fast on Docker Desktop)
      - ws:/home/ubuntu/ros2_ws
      # this repo, at the same place it sits on the robot:  ~/ros2_ws/src/karr_robot
      - ..:/home/ubuntu/ros2_ws/src/karr_robot

volumes:
  ws:
