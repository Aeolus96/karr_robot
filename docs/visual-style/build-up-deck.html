<title>Build-up Deck Reference</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: page header, then one 16:9 stage (1280x720 canvas scaled to fit) with controls under it. */
:root {
  --paper: #f7f8fa; --sheet: #ffffff; --slate-tint: #eceff3; --line: #d5dae1; --ink: #1b2430; --slate: #5a6675;
  --orange: #e8590c; --orange-ink: #b4470a; --orange-tint: #fde9dd;
  --ok: #2b8a3e; --ok-ink: #237032; --ok-tint: #e2f1e5;
  --stop: #c92a2a; --stop-fill: #c92a2a; --on-stop-fill: #ffffff; --stop-tint: #f9e1e1; --warn: #b7791f;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14171c; --sheet: #1b1f25; --slate-tint: #252a32; --line: #313842; --ink: #e6e9ee; --slate: #9ba5b2;
  --orange: #f07a3a; --orange-ink: #f39257; --orange-tint: #3a261a; --ok: #4cb563; --ok-ink: #6cc77f; --ok-tint: #18301e;
  --stop: #ef6b63; --stop-fill: #b8322b; --stop-tint: #3a1d1d; --warn: #d9a23f; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #14171c; --sheet: #1b1f25; --slate-tint: #252a32; --line: #313842; --ink: #e6e9ee; --slate: #9ba5b2;
  --orange: #f07a3a; --orange-ink: #f39257; --orange-tint: #3a261a; --ok: #4cb563; --ok-ink: #6cc77f; --ok-tint: #18301e;
  --stop: #ef6b63; --stop-fill: #b8322b; --stop-tint: #3a1d1d; --warn: #d9a23f; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 24px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 40px 72px; display: grid; gap: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.docbar { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.docbar h1 { margin: 0; font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.012em; }
.docbar .no { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--slate); text-align: right; }
.docbar .no b { color: var(--ink); font-weight: 500; }
.lede { margin: 12px 0 0; max-width: 70ch; }


.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--sheet); border-radius: 6px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.stage:fullscreen { border-radius: 0; box-shadow: none; background: var(--sheet); display: grid; place-items: center; }
.canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.slide { position: absolute; inset: 0; padding: 64px 88px 0; display: grid; grid-template-rows: auto auto 1fr 64px; opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s .25s; }
.slide.on { opacity: 1; visibility: visible; transition: opacity .25s ease; }
.lbl { font-family: var(--mono); font-size: 14px; line-height: 18px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--orange-ink); margin-bottom: 18px; }
.ttl { margin: 0; font-size: 52px; line-height: 58px; font-weight: 600; letter-spacing: -.018em; max-width: 20ch; text-wrap: balance; }
.body { padding-top: 28px; min-height: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 14px; color: var(--slate); }
.p { font-size: 24px; line-height: 36px; max-width: 34ch; margin: 0; color: var(--ink); }
.p.m { color: var(--slate); font-size: 21px; line-height: 32px; }
.cover .ttl { font-size: 80px; line-height: 84px; max-width: 14ch; }
.cover .body { display: grid; align-content: start; gap: 16px; }
.cover .band { position: absolute; left: 0; right: 0; top: 0; height: 14px; display: grid; grid-template-columns: 360fr 408fr 144fr 48fr; }
.cover .band i:nth-child(1) { background: var(--ink); } .cover .band i:nth-child(2) { background: var(--slate-tint); }
.cover .band i:nth-child(3) { background: var(--orange); } .cover .band i:nth-child(4) { background: var(--stop-fill); }

table.spec { border-collapse: collapse; width: 100%; font-size: 21px; line-height: 30px; }
table.spec th, table.spec td { text-align: left; padding: 11px 24px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.spec th { font-size: 16px; font-weight: 600; color: var(--slate); }
table.spec td.mo { font-family: var(--mono); font-size: 18px; white-space: nowrap; }
table.spec tr.safe td { background: var(--stop-tint); }
table.spec tr.safe td:first-child { box-shadow: -12px 0 0 var(--stop-tint); }
.sup { color: var(--orange-ink); font-weight: 600; font-size: .62em; vertical-align: super; line-height: 0; }
.fnote { font-size: 15px; color: var(--slate); margin: 14px 0 0; }


.fig svg { width: 100%; height: auto; display: block; }
.fig svg text { font-family: var(--mono); }
.fig .cap { font-size: 15px; color: var(--slate); margin-top: 8px; } .fig .cap b { color: var(--ink); font-weight: 600; margin-right: 6px; }
.t { font-family: var(--sans) !important; font-weight: 600; }
.n-neutral { fill: var(--slate-tint); } .n-decision { fill: var(--orange-tint); } .n-ok { fill: var(--ok-tint); } .n-safe { fill: var(--stop-fill); } .n-ink { fill: var(--ink); }
.tx-ink { fill: var(--ink); } .tx-slate { fill: var(--slate); } .tx-ok { fill: var(--ok-ink); } .tx-stop { fill: var(--stop); } .tx-on-safe { fill: var(--on-stop-fill); } .tx-on-ink { fill: var(--sheet); }
.e-flow { stroke: var(--slate); stroke-width: 1.4; fill: none; } .e-ok { stroke: var(--ok); stroke-width: 1.4; fill: none; }
.e-inhibit { stroke: var(--stop); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
.e-observe { stroke: var(--slate); stroke-width: 1.2; stroke-dasharray: 2 3; fill: none; }
.ah-flow { fill: var(--slate); } .ah-ok { fill: var(--ok); } .ah-stop { fill: var(--stop); }
.grid-l { stroke: var(--line); stroke-width: 1; }
.fig g[data-s] { transition: opacity .4s ease; }
.fig g.hid { opacity: 0; }
.fig g.dim { opacity: .28; }

/* build deck: two-column with step text */
.build { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.steptext { display: flex; gap: 18px; align-items: baseline; }
.steptext .n { font-family: var(--mono); font-size: 16px; color: var(--orange-ink); font-weight: 600; white-space: nowrap; }
.steptext p { margin: 0; font-size: 24px; line-height: 34px; max-width: 46ch; }

/* controls */
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.ctrl button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; }
.ctrl button:hover { border-color: var(--slate); }
.ctrl .count { font-family: var(--mono); font-size: 13px; color: var(--slate); min-width: 64px; }
.ctrl .hint { font-size: 13px; color: var(--slate); margin-left: auto; }
.rail { display: flex; gap: 4px; flex: 1 1 200px; min-width: 120px; }
.rail button { flex: 1; height: 8px; padding: 0; border: 0; border-radius: 2px; background: var(--line); cursor: pointer; }
.rail button.on { background: var(--orange); }
.rail button.seen { background: var(--slate); }
.notes { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 21px; display: grid; gap: 2px; max-width: 80ch; }
.notes li::marker { color: var(--slate); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .slide, .slide.on, .fig g[data-s] { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="docbar">
      <h1>Safety core, build-up deck</h1>
      <div class="no"><b>KARR-SC-011</b><br>Rev A, 2026-11-20</div>
    </div>
    <p class="lede">Reference deck for the K.A.R.R. visual style (docs/visual-style/notes.md). Arrow keys or the buttons move; Fullscreen presents.</p>
  </header>

  <div class="stage" id="stage" tabindex="0" aria-roledescription="slide deck" aria-label="Safety core deck">
    <div class="canvas" id="canvas"></div>
  </div>
  <div class="ctrl">
    <button type="button" id="prev" aria-label="Previous slide">Back</button>
    <button type="button" id="next" aria-label="Next slide">Next</button>
    <span class="count" id="count">1 / 7</span>
    <div class="rail" id="rail" aria-label="Jump to slide"></div>
    <button type="button" id="fs">Fullscreen</button>
  </div>
  <ul class="notes" id="notes"></ul>
</div>

<script>
(function () {
  // ---------- Signal path figure, grouped by build step ----------
  function sig(id) {
    return '<svg viewBox="0 0 1000 440" role="img" aria-label="Signal path from transmitter through permission check to relays; ROS observes only">' +
    '<defs>' +
    '<marker id="' + id + 'f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="ah-flow"/></marker>' +
    '<marker id="' + id + 'o" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="ah-ok"/></marker>' +
    '<marker id="' + id + 's" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="ah-stop"/></marker>' +
    '</defs>' +
    '<g data-s="1"><text x="0" y="16" font-size="12" class="t tx-slate">Hardware</text>' +
      '<rect x="0" y="40" width="140" height="58" rx="3" class="n-ink"/><text x="70" y="64" text-anchor="middle" font-size="13" class="t tx-on-ink">TGY-i6S</text><text x="70" y="82" text-anchor="middle" font-size="11" class="tx-on-ink">transmitter</text>' +
      '<path d="M140 69H178" class="e-flow" marker-end="url(#' + id + 'f)"/><text x="159" y="60" text-anchor="middle" font-size="10" class="tx-slate">2.4 GHz</text>' +
      '<rect x="180" y="40" width="140" height="58" rx="3" class="n-ink"/><text x="250" y="64" text-anchor="middle" font-size="13" class="t tx-on-ink">iA6B</text><text x="250" y="82" text-anchor="middle" font-size="11" class="tx-on-ink">ch6 = e-stop</text></g>' +
    '<g data-s="2"><line x1="340" y1="4" x2="340" y2="440" class="grid-l"/><text x="360" y="16" font-size="12" class="t tx-slate">Core 0, control task</text>' +
      '<path d="M320 69H368" class="e-flow" marker-end="url(#' + id + 'f)"/><text x="344" y="60" text-anchor="middle" font-size="10" class="tx-slate">i-BUS</text>' +
      '<rect x="370" y="40" width="180" height="58" rx="3" class="n-neutral"/><text x="460" y="64" text-anchor="middle" font-size="13" class="t tx-ink">RcReceiver</text><text x="460" y="82" text-anchor="middle" font-size="11" class="tx-slate">decode, every 1 ms</text></g>' +
    '<g data-s="3"><path d="M550 69H588" class="e-flow" marker-end="url(#' + id + 'f)"/>' +
      '<rect x="590" y="40" width="190" height="58" rx="3" class="n-decision"/><text x="685" y="64" text-anchor="middle" font-size="13" class="t tx-ink">Permission check</text><text x="685" y="82" text-anchor="middle" font-size="11" class="tx-slate">every 20 ms</text></g>' +
    '<g data-s="4"><path d="M780 69H818" class="e-ok" marker-end="url(#' + id + 'o)"/><text x="799" y="60" text-anchor="middle" font-size="10" class="tx-ok">yes</text>' +
      '<rect x="820" y="40" width="180" height="58" rx="3" class="n-ok"/><text x="910" y="64" text-anchor="middle" font-size="13" class="t tx-ok">applyRelayStates</text><text x="910" y="82" text-anchor="middle" font-size="11" class="tx-slate">TCA9554, 8 relays</text></g>' +
    '<g data-s="5"><path d="M685 98V150" class="e-inhibit" marker-end="url(#' + id + 's)"/><text x="693" y="128" font-size="10" class="tx-stop">no</text>' +
      '<rect x="590" y="152" width="190" height="50" rx="3" class="n-safe"/><text x="685" y="174" text-anchor="middle" font-size="13" class="t tx-on-safe">0x00 all-off</text><text x="685" y="191" text-anchor="middle" font-size="10.5" class="tx-on-safe">same write site</text>' +
      '<path d="M780 177H910V100" class="e-inhibit" marker-end="url(#' + id + 's)"/></g>' +
    '<g data-s="6"><line x1="340" y1="244" x2="1000" y2="244" class="grid-l"/><text x="360" y="262" font-size="12" class="t tx-slate">Core 1, Arduino loop</text>' +
      '<path d="M640 202V290H552" class="e-flow" marker-end="url(#' + id + 'f)"/><text x="648" y="236" font-size="10" class="tx-slate">copy state</text>' +
      '<rect x="370" y="280" width="180" height="58" rx="3" class="n-neutral"/><text x="460" y="304" text-anchor="middle" font-size="13" class="t tx-ink">Snapshot queue</text><text x="460" y="322" text-anchor="middle" font-size="11" class="tx-slate">length one, overwrite</text>' +
      '<path d="M460 338V370H588" class="e-flow" marker-end="url(#' + id + 'f)"/>' +
      '<rect x="590" y="350" width="190" height="58" rx="3" class="n-neutral"/><text x="685" y="374" text-anchor="middle" font-size="13" class="t tx-ink">MicroRosBridge</text><text x="685" y="392" text-anchor="middle" font-size="11" class="tx-slate">may block, never core 0</text>' +
      '<path d="M780 379H818" class="e-observe" marker-end="url(#' + id + 'f)"/><text x="799" y="370" text-anchor="middle" font-size="10" class="tx-slate">UDP</text>' +
      '<rect x="820" y="350" width="180" height="58" rx="3" class="n-ink"/><text x="910" y="374" text-anchor="middle" font-size="13" class="t tx-on-ink">micro-ROS agent</text><text x="910" y="392" text-anchor="middle" font-size="11" class="tx-on-ink">192.168.0.4:8888</text>' +
      '<path d="M740 350V300H760V100" class="e-observe" marker-end="url(#' + id + 'f)"/><text x="768" y="290" font-size="10" class="tx-slate">agent connected</text><text x="768" y="303" font-size="10" class="tx-slate">(atomic flag)</text>' +
      '<text x="820" y="430" font-size="10.5" class="tx-slate">/rc/joy 50 Hz, /rc/link, /relay_board/*</text>' +
      '<text x="0" y="300" font-size="12" class="t tx-ink">Publish-only</text><text x="0" y="318" font-size="11" class="tx-slate">No topic can write a relay.</text><text x="0" y="334" font-size="11" class="tx-slate">The only write site is on core 0.</text></g>' +
    '</svg>';
  }

  var FOOT = function () { return '<div class="foot"><span>KARR-SC deck, Rev A</span><span class="pg"></span></div>'; };
  function slide(label, title, body, cls) {
    return '<section class="slide ' + (cls || '') + '">' +
      (label ? '<div class="lbl">' + label + '</div>' : '<div></div>') +
      (title ? '<h2 class="ttl">' + title + '</h2>' : '<div></div>') +
      '<div class="body">' + (body || '') + '</div>' + FOOT() + '</section>';
  }
  var cover = '<section class="slide cover"><div class="band"><i></i><i></i><i></i><i></i></div><div class="lbl" style="margin-top:40px">K.A.R.R.</div><h2 class="ttl">Safety core</h2>' +
    '<div class="body"><p class="p m">Firmware for the RC safety and relay controller of the Keystone Autonomous Resource Rover.</p></div>' + FOOT() + '</section>';
  var invariant = slide('Safety invariant', 'Relays never take orders from ROS',
    '<p class="p m">The micro-ROS link is publish-only. No topic, service or parameter can energize a relay. Every relay write happens on the board, on core 0.</p>');
  var allOff = slide('All-off conditions', 'Any one of these writes 0x00',
    '<table class="spec"><tr><th>Condition</th><th>Limit</th><th>Write</th></tr>' +
    '<tr class="safe"><td>RC frames stale</td><td class="mo">&gt; 200 ms</td><td class="mo">0x00</td></tr>' +
    '<tr class="safe"><td>Receiver failsafe signature</td><td class="mo">200 ms confirm</td><td class="mo">0x00</td></tr>' +
    '<tr class="safe"><td>ch6 e-stop switch low</td><td class="mo">decoded</td><td class="mo">0x00</td></tr>' +
    '<tr class="safe"><td>micro-ROS agent lost<span class="sup">1</span></td><td class="mo">ping fails</td><td class="mo">0x00</td></tr>' +
    '<tr class="safe"><td>Relay expander fault</td><td class="mo">I2C</td><td class="mo">0x00</td></tr></table>' +
    '<p class="fnote"><span class="sup">1</span> FORCE_SAFE_ON_AGENT_LOSS, on by default. Recovery is automatic; there is no rearm gesture.</p>');
  var next = slide('Next', 'What comes next',
    '<table class="spec"><tr><td class="mo">Phase 2</td><td>Validate Joy content and channel table on hardware</td></tr>' +
    '<tr><td class="mo">Phase 3</td><td>Real relay features replace placeholder bindings</td></tr>' +
    '<tr><td class="mo">Phase 4</td><td>Diagnostics depth: I2C failures, agent RTT, reset cause</td></tr>' +
    '<tr><td class="mo">Phase 5</td><td>CAN on GPIO17/18, RTC decision</td></tr></table>');

  // Build deck steps
  var BUILD = [
    [1, 'The operator holds a TGY-i6S. The iA6B receiver turns its 10 channels into an i-BUS stream; ch6 is reserved for the e-stop.'],
    [2, 'On core 0, RcReceiver decodes a frame every millisecond and tracks link state.'],
    [3, 'Every 20 ms one function decides whether the RC features may run.'],
    [4, 'If yes, the requested bits go to the relay expander. This is the only relay write in the firmware.'],
    [5, 'If no, the same call writes 0x00. Safe is a write, not an absence.'],
    [6, 'Core 1 copies the state out and publishes it. Nothing comes back except one flag: is the agent there?']
  ];
  function buildSlide(i) {
    var s = BUILD[i];
    return '<section class="slide figslide" data-step="' + s[0] + '"><div class="lbl">Signal path, step ' + s[0] + ' of 6</div><div></div>' +
      '<div class="body build" style="padding-top:0"><div class="steptext"><p>' + s[1] + '</p></div><div class="fig">' + sig('b' + i) + '</div></div>' + FOOT() + '</section>';
  }


  var DECKS = {
    B: { slides: [cover, invariant].concat(BUILD.map(function (_, i) { return buildSlide(i); })).concat([allOff, next]),
         notes: ['Earlier steps dim and the new block fades in. One sentence per step.', 'For .pptx or PDF export, rebuild in the claude.ai Slides type with these rules.'] }
  };

  var canvas = document.getElementById('canvas'), stage = document.getElementById('stage');
  var countEl = document.getElementById('count'), rail = document.getElementById('rail'), notesEl = document.getElementById('notes');
  var deck = 'A', idx = 0, slides = [];

  function load(d) {
    deck = d; idx = 0;
    canvas.innerHTML = DECKS[d].slides.join('');
    slides = Array.prototype.slice.call(canvas.querySelectorAll('.slide'));
    slides.forEach(function (s, i) { var pg = s.querySelector('.pg'); if (pg) pg.textContent = (i + 1) + ' / ' + slides.length; });
    // build deck: set visibility per step
    slides.forEach(function (s) {
      var st = +s.getAttribute('data-step');
      if (!st) return;
      s.querySelectorAll('g[data-s]').forEach(function (g) {
        var n = +g.getAttribute('data-s');
        g.classList.toggle('hid', n > st);
        g.classList.toggle('dim', n < st);
      });
    });
    rail.innerHTML = slides.map(function (_, i) { return '<button type="button" aria-label="Slide ' + (i + 1) + '"></button>'; }).join('');
    notesEl.innerHTML = DECKS[d].notes.map(function (n) { return '<li>' + n + '</li>'; }).join('');
    show(0);
  }
  function show(i) {
    idx = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (s, k) { s.classList.toggle('on', k === idx); });
    countEl.textContent = (idx + 1) + ' / ' + slides.length;
    Array.prototype.forEach.call(rail.children, function (b, k) { b.className = k === idx ? 'on' : (k < idx ? 'seen' : ''); });
  }
  rail.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) show(Array.prototype.indexOf.call(rail.children, b)); });
  document.getElementById('prev').addEventListener('click', function () { show(idx - 1); });
  document.getElementById('next').addEventListener('click', function () { show(idx + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && document.activeElement === stage)) { e.preventDefault(); show(idx + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(idx - 1); }
  });
  document.getElementById('fs').addEventListener('click', function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (stage.requestFullscreen) stage.requestFullscreen().catch(function () {});
    } catch (err) {}
  });
  function fit() {
    var w = stage.clientWidth, h = stage.clientHeight;
    var s = Math.min(w / 1280, h / 720);
    canvas.style.transform = 'translate(' + ((w - 1280 * s) / 2) + 'px,' + ((h - 720 * s) / 2) + 'px) scale(' + s + ')';
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage); else window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);


  load('B'); fit();
})();
</script>
